name: Build & Package (Debian 12 .deb)

on:
  push:
    branches: [ main, 'chatbox/**', 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, 'chatbox/**', 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  static-code-analysis:
    name: Static Code Analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cppcheck

      - name: Run cppcheck Static Analysis
        run: |
          cppcheck --enable=warning,performance,portability \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   --suppress=unknownMacro \
                   --error-exitcode=1 \
                   src/utils/confighandler.cpp \
                   src/tools/imgupload/storages/nullpointer/ \
                   src/tools/record/

  build-debian12:
    name: Build Debian 12 (bookworm) amd64 .deb
    needs: static-code-analysis
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            ca-certificates \
            qtbase5-dev \
            libqt5svg5-dev \
            qttools5-dev \
            qttools5-dev-tools \
            libx11-dev \
            libxfixes-dev \
            libxext-dev \
            ffmpeg \
            dpkg-dev \
            wget \
            xvfb \
            xdotool

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Build sstrip from ELFkickers
        run: |
          mkdir -p /tmp/elfkickers
          cd /tmp/elfkickers
          wget -q http://www.muppetlabs.com/~breadbox/pub/software/ELFkickers-3.2.tar.gz || curl -sSL http://www.muppetlabs.com/~breadbox/pub/software/ELFkickers-3.2.tar.gz -o ELFkickers-3.2.tar.gz
          tar -xf ELFkickers-3.2.tar.gz
          cd ELFkickers-3.2/elfrw && make libelfrw.a
          cd ../sstrip && gcc -O2 -I../elfrw sstrip.c ../elfrw/libelfrw.a -o /usr/local/bin/sstrip
          chmod +x /usr/local/bin/sstrip
          rm -rf /tmp/elfkickers

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_IPO=ON

      - name: Build binary
        run: cmake --build build -j$(nproc)

      - name: Build Debian package
        run: |
          mkdir -p release-artifacts
          ./packaging/build_deb.sh build ./release-artifacts
          strip -s -R .comment -R .note -R .note.gnu.build-id -R .note.ABI-tag build/src/flameshot -o ./release-artifacts/flameshot-plus
          if command -v sstrip >/dev/null 2>&1; then
            sstrip ./release-artifacts/flameshot-plus || true
          fi
          chmod +x ./release-artifacts/flameshot-plus

          # Generate SHA256 checksums
          cd release-artifacts
          sha256sum flameshot-plus flameshot-plus_*.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          # Generate structured release notes from template
          sed "s/\${VERSION}/${{ github.ref_name }}/g" packaging/release_notes.md.template > release_notes.md

      - name: Run Quality Assurance & Integrity Test Suite
        run: |
          chmod +x ./tests/run_all_tests.sh
          ./tests/run_all_tests.sh ./release-artifacts/flameshot-plus ./release-artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flameshot-plus-debian12-amd64
          path: |
            release-artifacts/*.deb
            release-artifacts/flameshot-plus

      - name: Release assets (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Flameshot + ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release-artifacts/*.deb
            release-artifacts/flameshot-plus
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-package:
    name: Publish to GitHub Packages (GHCR)
    needs: build-debian12
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: flameshot-plus-debian12-amd64
          path: release-artifacts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push package to GHCR
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          cat << 'EOF' > Dockerfile.package
          FROM debian:bookworm-slim
          LABEL org.opencontainers.image.source="https://github.com/Svarkovsky/flameshot-plus"
          LABEL org.opencontainers.image.description="Flameshot +: Native lightweight screen annotation, smart window detection, WebP capture, and integrated desktop video & audio recording."
          COPY release-artifacts/flameshot-plus_12.1.0-1_amd64.deb /flameshot-plus.deb
          RUN apt-get update && apt-get install -y --no-install-recommends /flameshot-plus.deb && rm -rf /var/lib/apt/lists/*
          ENTRYPOINT ["flameshot-plus"]
          EOF

          docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:12.1.0-1" -f Dockerfile.package .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:12.1.0-1"
