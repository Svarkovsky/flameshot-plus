name: Build & Package (Debian 12 .deb)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-debian12:
    name: Build Debian 12 (bookworm) amd64 .deb
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            ca-certificates \
            qtbase5-dev \
            libqt5svg5-dev \
            qttools5-dev \
            qttools5-dev-tools \
            libx11-dev \
            ffmpeg \
            dpkg-dev \
            wget

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sstrip from ELFkickers
        run: |
          mkdir -p /tmp/elfkickers
          cd /tmp/elfkickers
          wget -q http://www.muppetlabs.com/~breadbox/pub/software/ELFkickers-3.2.tar.gz || curl -sSL http://www.muppetlabs.com/~breadbox/pub/software/ELFkickers-3.2.tar.gz -o ELFkickers-3.2.tar.gz
          tar -xf ELFkickers-3.2.tar.gz
          cd ELFkickers-3.2/elfrw && make libelfrw.a
          cd ../sstrip && gcc -O2 -I../elfrw sstrip.c ../elfrw/libelfrw.a -o /usr/local/bin/sstrip
          chmod +x /usr/local/bin/sstrip
          rm -rf /tmp/elfkickers

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_IPO=ON

      - name: Build binary
        run: cmake --build build -j$(nproc)

      - name: Build Debian package
        run: |
          mkdir -p release-artifacts
          ./packaging/build_deb.sh build ./release-artifacts
          strip -s -R .comment -R .note -R .note.gnu.build-id -R .note.ABI-tag build/src/flameshot -o ./release-artifacts/flameshot-plus
          if command -v sstrip >/dev/null 2>&1; then
            sstrip ./release-artifacts/flameshot-plus || true
          fi
          chmod +x ./release-artifacts/flameshot-plus

          # Generate SHA256 checksums
          cd release-artifacts
          sha256sum flameshot-plus flameshot-plus_*.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          # Generate structured release notes
          cat << 'EOF' > release_notes.md
## Flameshot + ${{ github.ref_name }}

Lightweight, optimized screen annotation with smart window detection, default WebP capture, integrated video/audio recording, and free anonymous cloud sharing.

### Key Features

- **Integrated Video & Audio Recording:** Record any selected screen region or window directly into high-quality MP4 (`x264` + `AAC`) with perfect A/V synchronization. Automatic output to `~/Video/flameshot-plus/`.
- **Pre-Record Floating HUD:** Dedicated 530px floating toolbar. Choose your audio source before recording: System Audio (auto-detects monitor sink including Bluetooth), Microphone, Mixed (System + Mic), or Muted.
- **Window Snapping (X11):** Instant geometry detection. Double-click or press `W` / `Tab` to snap the selection box to any window under cursor.
- **Free Anonymous Cloud Upload (0x0.st / Catbox):** Dead Imgur API keys removed. Upload any screenshot with 1-click directly to **0x0.st** with automatic fast fallback to **Catbox.moe**. Direct links copied to clipboard with notifications.
- **Default WebP Format:** Modern, lightweight screenshot format out of the box.
- **Maximum Build Optimization:** Compiled with `-O3`, `-flto=auto` (Link-Time Optimization), dead-code elimination (`-Wl,--gc-sections`), and `sstrip` from ELFkickers. Standalone binary is only **1.6 MB**, `.deb` package is only **650 KB**.
- **Debian Policy Compliant:** Package provides, conflicts, and replaces stock `flameshot` for seamless zero-conflict upgrades.

---

### Quick Installation (Debian 12 / Ubuntu)

```bash
wget https://github.com/Svarkovsky/flameshot-plus/releases/download/${{ github.ref_name }}/flameshot-plus_12.1.0-1_amd64.deb
sudo apt install ./flameshot-plus_12.1.0-1_amd64.deb
```

Or run the standalone binary directly:
```bash
wget https://github.com/Svarkovsky/flameshot-plus/releases/download/${{ github.ref_name }}/flameshot-plus
chmod +x ./flameshot-plus
./flameshot-plus gui
```

---

### Verification (SHA256)

Verify downloaded assets against `SHA256SUMS.txt`:
```bash
sha256sum -c SHA256SUMS.txt
```

---

### Upstream Attribution & Disclaimer

All original rights, intellectual property, and authorship belong entirely to the original authors and contributors of Flameshot at [https://github.com/flameshot-org/flameshot](https://github.com/flameshot-org/flameshot). This fork is distributed AS-IS under GPLv3 without warranties of any kind.
EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flameshot-plus-debian12-amd64
          path: |
            release-artifacts/*.deb
            release-artifacts/flameshot-plus

      - name: Release assets (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Flameshot + ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release-artifacts/*.deb
            release-artifacts/flameshot-plus
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-package:
    name: Publish to GitHub Packages (GHCR)
    needs: build-debian12
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: flameshot-plus-debian12-amd64
          path: release-artifacts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push package to GHCR
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          cat << 'EOF' > Dockerfile.package
          FROM debian:bookworm-slim
          LABEL org.opencontainers.image.source="https://github.com/Svarkovsky/flameshot-plus"
          LABEL org.opencontainers.image.description="Flameshot +: Native lightweight screen annotation, smart window detection, WebP capture, and integrated desktop video & audio recording."
          COPY release-artifacts/flameshot-plus_12.1.0-1_amd64.deb /flameshot-plus.deb
          RUN apt-get update && apt-get install -y --no-install-recommends /flameshot-plus.deb && rm -rf /var/lib/apt/lists/*
          ENTRYPOINT ["flameshot-plus"]
          EOF

          docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:12.1.0-1" -f Dockerfile.package .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:12.1.0-1"
